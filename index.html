<!DOCTYPE html>
<html lang="en">
<head>

  <meta name="description" content="Haruki's corner of the internet.">

  <link rel="preconnect" href="https://fonts.googleapis.com">

    <video class="background-video" autoplay muted loop playsinline preload="auto">
      <source src="assets/background.mp4" type="video/mp4">
    </video>
    <div class="background-overlay"></div>

  <main class="page">

        <h1 id="profile-name">Haruki</h1>

            <span>H</span>
            <img id="discord-icon" alt="" width="58" height="58" hidden>
          </div>

            <strong id="discord-name">Haruki.lol</strong>
            <p id="discord-counts" aria-live="polite">Loading server details...</p>
          </div>
          <div class="discord-action">
            <span>Discord</span>
            <a href="https://discord.gg/harukilol" target="_blank" rel="noopener noreferrer" aria-label="Join Haruki's Discord server">Join</a>
          </div>
        </div>
        <p class="bio" aria-label="Game Dev of 4 years"><span class="bio-typing" aria-hidden="true">Game Dev of 4 years</span></p>
      </div>

      </ul>

        <span>haruki.lol</span>
        <button class="music-toggle" type="button" aria-pressed="false" aria-label="Play music" title="Play music">

      <p class="music-error" role="status" hidden></p>
