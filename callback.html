<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>verifying | haruki.lol</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<main>
  <h1 id="title">verifying</h1>
  <p class="sub" id="msg">hold on...</p>
  <nav id="links" hidden>
    <a href="https://discord.gg/harukilol" target="_blank" rel="noopener">discord</a>
    <a href="/">home</a>
  </nav>
</main>
<script>
  // The bot host is plain http, so we navigate to it (fetch from https would be blocked).
  // The bot finishes verification and sends the user back to /verified.
  const BOT_URL = 'http://fi11.bot-hosting.cloud:25362';

  const params = new URLSearchParams(location.search);
  const code = params.get('code');
  const state = params.get('state');

  if (code && state) {
    location.replace(BOT_URL + '/callback?' + new URLSearchParams({ code, state }));
  } else {
    document.getElementById('title').textContent = 'invalid';
    document.getElementById('msg').textContent = 'invalid verification link. run /verify again.';
    document.getElementById('links').hidden = false;
  }
</script>
</body>
</html>
